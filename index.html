<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMCODE.ONLINE - Koniec</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e3c72 0%, #2a5298 50%, #081426 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Tło z latającymi kropeczkami */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float text linear infinite;
        }

        /* Animacja wejścia okienka i pulsowania */
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8) translateZ(-100px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateZ(0);
            }
        }

        /* Główny kontener (okienko) */
        .card-container {
            position: relative;
            z-index: 2;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3rem 2rem;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
            animation: fadeInScale 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-style: preserve-3d;
        }

        /* Elementy wewnątrz okienka z efektem głębi 3D */
        .card h1 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            transform: translateZ(40px);
        }

        .card h1 span {
            color: #ff4d4d;
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.5);
        }

        .card p {
            color: #e0e6ed;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            transform: translateZ(25px);
        }

        .card p.important {
            color: #ffb84d;
            font-weight: 600;
            margin-top: 1.5rem;
            transform: translateZ(30px);
        }

        /* Style dla animacji kropek */
        @keyframes float {
            0% {
                transform: translateY(105vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-5vh) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="card-container" id="cardContainer">
        <div class="card">
            <h1>MMCODE.ONLINE x <span>KONIEC</span></h1>
            <p>Z racji tego, że nikt nic nie kupował,</p>
            <p class="important">zamykamy możliwości zakupu<br>oraz serwer Discord.</p>
        </div>
    </div>

    <script>
        // 1. Generowanie latających kropek w tle
        const particlesContainer = document.getElementById('particles');
        const particleCount = 60;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Losowe parametry dla kropek
            const size = Math.random() * 5 + 2;
            const posX = Math.random() * 100;
            const delay = Math.random() * 10;
            const duration = Math.random() * 15 + 10;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${posX}%`;
            particle.style.animationDelay = `${delay}s`;
            particle.style.animationDuration = `${duration}s`;

            particlesContainer.appendChild(particle);
        }

        // 2. Efekt animacji okienka przy przesuwaniu myszką (3D Tilt)
        const container = document.getElementById('cardContainer');
        
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            // Obracamy okienko w zależności od pozycji myszki
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
        });

        // Resetowanie pozycji, gdy myszka zejdzie z ekranu
        document.addEventListener('mouseleave', () => {
            container.style.transform = `rotateY(0deg) rotateX(0deg)`;
            container.style.transition = 'transform 0.5s ease';
        });

        document.addEventListener('mouseenter', () => {
            container.style.transition = 'none';
        });
    </script>
</body>
</html>
